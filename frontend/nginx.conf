server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Same-origin browser API path. The browser never resolves the internal
    # Compose service name; only Nginx does that on the private network.
    location = /backend {
        return 308 /backend/;
    }

    location /backend/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Vite's React application uses client-side routes. Unknown non-API paths
    # must return the app shell rather than an Nginx 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
